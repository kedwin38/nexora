<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<title>NEXORA // ISP OS</title>
<style>
  :root {
    --bg: #06080d; --bg2:#080b12; --panel: #0b0f17; --panel2: #0e1420; --line: #1a2332; --line2:#243247;
    --txt: #d7e0ee; --dim: #6b7a90; --dim2:#8a99ad; --acc: #38e1c4; --acc2:#2bb6d6; --warn: #f5c451; --crit: #f26d6d; --good:#57d98e; --purple:#9b8cff;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace; --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    --r: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html,body { height:100%; }
  body { background: radial-gradient(1200px 600px at 80% -10%, #0c1524 0, var(--bg) 55%) fixed, var(--bg); color: var(--txt); font-family: var(--sans); font-size: 14px; min-height: 100vh; }
  a { color: var(--acc); text-decoration: none; }
  .mono { font-family: var(--mono); }
  .dim { color: var(--dim); } .dim2 { color: var(--dim2); }
  header { display: flex; justify-content: space-between; align-items: center; gap:12px; padding: 12px 22px; border-bottom: 1px solid var(--line); background: rgba(11,15,23,.85); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 30; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .logo { width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--acc2)); box-shadow:0 0 18px rgba(56,225,196,.4); }
  .brand b { font-family: var(--mono); letter-spacing: 3px; font-size: 15px; color: var(--txt); }
  .brand small { color: var(--dim); letter-spacing: 1px; font-family:var(--mono); font-size:10px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav a { padding:7px 12px; border-radius:6px; font-family: var(--mono); font-size: 11px; color: var(--dim2); text-transform: uppercase; letter-spacing:.5px; }
  nav a:hover { color: var(--txt); background: var(--panel2); }
  nav a.active { color: var(--acc); background: rgba(56,225,196,.08); }
  .usermenu { display:flex; align-items:center; gap:10px; }
  .avatar { width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2); display:flex;align-items:center;justify-content:center; font-family:var(--mono); font-size:12px; color:var(--acc); }
  .who { text-align:right; line-height:1.25; }
  .who .n { font-size:12px; } .who .r { font-size:10px; color:var(--dim); font-family:var(--mono); text-transform:uppercase; }
  main { max-width: 1240px; margin: 0 auto; padding: 26px 22px 60px; }
  h1 { font-size: 20px; margin-bottom: 3px; letter-spacing: .5px; }
  .sub { color: var(--dim); font-size: 12px; font-family: var(--mono); margin-bottom: 22px; }
  .grid { display: grid; gap: 14px; }
  .grid.c2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .grid.c3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .grid.c4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .card.hover:hover { border-color: var(--line2); }
  .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; font-family: var(--mono); }
  .v { font-family: var(--mono); font-size: 24px; margin-top: 6px; font-weight:600; }
  .v.sm { font-size:18px; }
  .v.ok { color: var(--good); } .v.acc { color: var(--acc); } .v.warn { color: var(--warn); } .v.crit { color: var(--crit); }
  .stat-sub { font-size:11px; color:var(--dim); font-family:var(--mono); margin-top:4px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  th { text-align: left; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 8px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); color: var(--txt); vertical-align:middle; }
  tr:hover td { background: var(--panel2); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; letter-spacing: .5px; font-family:var(--mono); border:1px solid transparent; }
  .pill.ok,.pill.SUCCESS,.pill.ACTIVE,.pill.PAID,.pill.ONLINE,.pill.CONFIRMED { background: rgba(87,217,142,.12); color: var(--good); border-color: rgba(87,217,142,.35); }
  .pill.warn,.pill.PENDING,.pill.PROCESSING,.pill.VERIFYING,.pill.TRIALING,.pill.PAST_DUE,.pill.OVERDUE,.pill.FUP,.pill.WARNING { background: rgba(245,196,81,.1); color: var(--warn); border-color: rgba(245,196,81,.35); }
  .pill.crit,.pill.FAILED,.pill.PERMANENT_FAILURE,.pill.CANCELLED,.pill.EXPIRED,.pill.SUSPENDED,.pill.OFFLINE,.pill.CRITICAL,.pill.CLOSED { background: rgba(242,109,109,.1); color: var(--crit); border-color: rgba(242,109,109,.35); }
  .pill.INFO,.pill.RETRYING,.pill.DRAFT { background: rgba(56,225,196,.06); color: var(--dim2); border-color: var(--line2); }
  input, button, select, textarea { font-family: var(--mono); font-size: 13px; }
  label.f { display:block; font-family:var(--mono); font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:10px 0 4px; }
  input, select, textarea { width: 100%; background: var(--bg); color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 4px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); box-shadow:0 0 0 3px rgba(56,225,196,.08); }
  button { background: linear-gradient(135deg,var(--acc),var(--acc2)); color: #04110d; border: none; border-radius: 6px; padding: 10px 16px; font-weight: 700; cursor: pointer; letter-spacing: .5px; }
  button:hover { filter: brightness(1.1); } button:disabled { opacity: .5; cursor: wait; }
  button.wide { width:100%; margin-top:8px; }
  button.ghost { background: transparent; color: var(--acc); border: 1px solid var(--line2); padding: 6px 12px; font-size: 11px; font-weight:600; }
  button.ghost:hover { border-color:var(--acc); background:rgba(56,225,196,.06); }
  button.danger { background: transparent; color: var(--crit); border:1px solid rgba(242,109,109,.4); padding:6px 12px; font-size:11px; }
  button.mini { padding:4px 9px; font-size:10px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 18px; border-bottom:1px solid var(--line); padding-bottom:2px; }
  .tabs button { width: auto; background: transparent; color: var(--dim2); border: 1px solid transparent; border-radius:6px 6px 0 0; padding: 8px 14px; font-size: 11px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
  .tabs button.active { color: var(--acc); border-color: var(--line); border-bottom-color:var(--bg); background:var(--panel); }
  .pkg, .plan { cursor: pointer; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--panel); transition:.12s; }
  .pkg:hover,.plan:hover { border-color:var(--line2); }
  .pkg.sel, .plan.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
  .pkg .name, .plan .name { font-family: var(--mono); font-size: 14px; }
  .pkg .price, .plan .price { font-family: var(--mono); font-size: 22px; color: var(--acc); margin-top: 6px; }
  .plan .price small { font-size:11px; color:var(--dim); }
  .plan ul { list-style:none; margin-top:10px; font-size:11px; color:var(--dim2); }
  .plan li { padding:3px 0; padding-left:16px; position:relative; }
  .plan li:before { content:"✓"; color:var(--acc); position:absolute; left:0; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--acc); color: var(--txt); padding: 12px 16px; border-radius: 8px; font-family: var(--mono); font-size: 12px; display: none; max-width: 380px; z-index: 99; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .spacer { flex:1; }
  .muted-card { background:var(--bg2); border:1px dashed var(--line2); border-radius:var(--r); padding:14px; color:var(--dim); font-family:var(--mono); font-size:12px; }
  .sev-dot { width:8px;height:8px;border-radius:50%; display:inline-block; margin-right:6px; }
  .sev-CRITICAL{background:var(--crit);} .sev-WARNING{background:var(--warn);} .sev-INFO{background:var(--acc);}
  .bars { display:flex; align-items:flex-end; gap:4px; height:80px; }
  .bars .bar { flex:1; background:linear-gradient(180deg,var(--acc),rgba(43,182,214,.25)); border-radius:3px 3px 0 0; min-height:2px; position:relative; }
  .bars .bar:hover:after { content:attr(data-label); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line2); padding:2px 6px; border-radius:4px; font-size:10px; font-family:var(--mono); white-space:nowrap; margin-bottom:4px; }
  footer { text-align: center; color: var(--dim); font-family: var(--mono); font-size: 10px; padding: 30px 0; letter-spacing: 2px; }
  .hide{display:none!important;}
  @media (max-width:640px){ header{flex-wrap:wrap;} .who{display:none;} }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo"></div><div><b>NEXORA</b><br><small>ISP OPERATING SYSTEM</small></div></div>
  <nav id="nav"></nav>
  <div class="usermenu" id="usermenu"></div>
</header>
<main id="view"><div class="card mono dim">LOADING…</div></main>
<div id="toast"></div>
<footer>NEXORA ISP OS // MULTI-TENANT CONTROL PLANE</footer>

<script>
const API = '';
const $ = (s) => document.querySelector(s);
const store = {
  get: (k) => { try { return JSON.parse(localStorage.getItem('nexora_' + k) || 'null'); } catch { return null; } },
  set: (k, v) => localStorage.setItem('nexora_' + k, JSON.stringify(v)),
  del: (k) => localStorage.removeItem('nexora_' + k),
};
let ME = null; // cached staff identity+permissions

function toast(msg, isErr = false) {
  const t = $('#toast'); t.textContent = msg;
  t.style.borderColor = isErr ? 'var(--crit)' : 'var(--acc)';
  t.style.display = 'block'; clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.style.display = 'none'), 5000);
}
async function api(path, opts = {}) {
  const token = store.get('user_token') || store.get('customer_token');
  const res = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && store.get('user_token')) { /* token invalid */ }
  if (!res.ok) throw new Error(body?.error?.message || body?.message || 'HTTP ' + res.status);
  return body;
}
const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const pill = (v) => '<span class="pill ' + esc(v) + '">' + esc(v) + '</span>';
const fmtKes = (minor) => 'KES ' + (Number(minor || 0) / 100).toLocaleString('en-KE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fmtWhen = (iso) => iso ? new Date(iso).toLocaleString() : '—';
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString() : '—';
const gb = (b) => (Number(b) / 1024 ** 3).toFixed(1) + 'GB';

function barChart(series, fmt) {
  const max = Math.max(1, ...series.map(s => s.v));
  return '<div class="bars">' + series.map(s => `<div class="bar" style="height:${Math.round((s.v/max)*100)}%" data-label="${esc(s.label)}: ${fmt ? fmt(s.v) : s.v}"></div>`).join('') + '</div>';
}
function can(p) { return ME && ME.permissions && ME.permissions.includes(p); }
function isOwner() { return ME && ME.user && ME.user.role === 'PLATFORM_OWNER'; }

async function loadMe() {
  if (!store.get('user_token')) { ME = null; return null; }
  try { ME = await api('/api/v1/auth/me'); store.set('user', ME.user); return ME; }
  catch { store.del('user_token'); ME = null; return null; }
}
function logout() {
  api('/api/v1/auth/logout', { method: 'POST' }).catch(() => {});
  store.del('user_token'); store.del('customer_token'); store.del('user'); ME = null;
  location.href = '/auth/login';
}

// ---------- Chrome (header nav + user menu) ----------
function renderChrome(active) {
  const nav = $('#nav'); const um = $('#usermenu');
  const staff = store.get('user_token'); const cust = store.get('customer_token');
  let links = [];
  if (cust) links = [['/dashboard','Dashboard'],['/packages','Packages']];
  else if (isOwner()) links = [['/owner','Owner'],['/guide','Guide']];
  else if (staff) {
    links = [['/admin','Admin']];
    links.push(['/guide','Guide']);
  } else links = [['/auth/login','Sign in'],['/guest','Guest wifi'],['/guide','Guide']];
  nav.innerHTML = links.map(([h,l]) => `<a href="${h}" class="${location.pathname===h?'active':''}">${l}</a>`).join('');
  if (staff && ME && ME.user) {
    const init = (ME.user.displayName || ME.user.email || '?').slice(0,1).toUpperCase();
    um.innerHTML = `<div class="who"><div class="n">${esc(ME.user.displayName||ME.user.email)}</div><div class="r">${esc(ME.user.role)}${ME.tenant?' · '+esc(ME.tenant.name):''}</div></div><div class="avatar">${init}</div><button class="ghost mini" id="logout">LOGOUT</button>`;
    $('#logout').onclick = logout;
  } else if (cust) {
    um.innerHTML = `<button class="ghost mini" id="logoutc">LOGOUT</button>`;
    $('#logoutc').onclick = () => { store.del('customer_token'); location.href='/auth/login'; };
  } else um.innerHTML = '';
}

const views = {};

// ---------- LOGIN + SIGNUP ----------
views.login = () => {
  $('#view').innerHTML = `
    <h1>Welcome to NEXORA</h1>
    <div class="sub">// the multi-tenant ISP operating system</div>
    <div class="grid c2">
      <div class="card">
        <div class="k">Operator / Owner sign in</div>
        <label class="f">Email</label><input id="a-email" placeholder="you@company.co.ke" />
        <label class="f">Password</label><input id="a-pass" type="password" placeholder="••••••••" />
        <button class="wide" id="a-go">SIGN IN</button>
        <p class="sub" style="margin-top:12px">Company admins &amp; the platform owner sign in here.</p>
      </div>
      <div class="card">
        <div class="k">Customer access</div>
        <label class="f">Company handle (optional)</label><input id="c-tenant" placeholder="acme-fibre" />
        <label class="f">Phone</label><input id="c-phone" placeholder="0712345678" />
        <label class="f">Password</label><input id="c-pass" type="password" placeholder="••••••••" />
        <div class="row"><button id="c-login" style="flex:1">SIGN IN</button><button class="ghost" id="c-reg">CREATE</button></div>
      </div>
    </div>
    <br/>
    <div class="card">
      <div class="k">Start your ISP on NEXORA — 14-day free trial</div>
      <div class="grid c2" style="margin-top:8px">
        <div><label class="f">Company name</label><input id="s-company" placeholder="Acme Fibre" />
          <label class="f">Your name</label><input id="s-name" placeholder="Jane Doe" />
          <label class="f">Contact phone</label><input id="s-phone" placeholder="0712345678" /></div>
        <div><label class="f">Admin email</label><input id="s-email" placeholder="admin@acmefibre.co.ke" />
          <label class="f">Admin password (min 10)</label><input id="s-pass" type="password" placeholder="••••••••••" />
          <button class="wide" id="s-go" style="margin-top:22px">CREATE COMPANY →</button></div>
      </div>
      <p class="sub" style="margin-top:8px">You become your company's SUPER_ADMIN with a ready-to-sell catalogue. Configure M-Pesa in Admin → Settings.</p>
    </div>`;
  $('#a-go').onclick = async () => {
    try { const r = await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:$('#a-email').value,password:$('#a-pass').value})});
      store.set('user_token',r.token); store.set('user',r.user); store.del('customer_token');
      location.href = r.user?.role==='PLATFORM_OWNER'?'/owner':'/admin'; } catch(e){ toast(e.message,true); } };
  $('#c-login').onclick = async () => {
    try { const t=$('#c-tenant').value.trim()||undefined; const r=await api('/api/v1/customers/login',{method:'POST',body:JSON.stringify({phone:$('#c-phone').value,password:$('#c-pass').value,tenant:t})});
      store.set('customer_token',r.token); store.del('user_token'); location.href='/dashboard'; } catch(e){ toast(e.message,true); } };
  $('#c-reg').onclick = async () => {
    try { const t=$('#c-tenant').value.trim()||undefined; const r=await api('/api/v1/customers/register',{method:'POST',body:JSON.stringify({phone:$('#c-phone').value,password:$('#c-pass').value,tenant:t})});
      store.set('customer_token',r.token); store.del('user_token'); toast('Account created.'); location.href='/dashboard'; } catch(e){ toast(e.message,true); } };
  $('#s-go').onclick = async () => {
    try { const r=await api('/api/v1/tenants/signup',{method:'POST',body:JSON.stringify({companyName:$('#s-company').value,adminName:$('#s-name').value,adminEmail:$('#s-email').value,adminPassword:$('#s-pass').value,contactPhone:$('#s-phone').value||undefined})});
      store.set('user_token',r.token); store.set('user',r.user); store.del('customer_token'); toast('Welcome to NEXORA!'); location.href='/admin'; } catch(e){ toast(e.message,true); } };
};

// ---------- CUSTOMER DASHBOARD ----------
views.dashboard = async () => {
  if (!store.get('customer_token')) return location.href='/auth/login';
  let me; try { me = await api('/api/v1/customers/me'); } catch { store.del('customer_token'); return location.href='/auth/login'; }
  const sub = me.subscription; const snap = sub?.policySnapshot || {}; const fup = me.fup;
  $('#view').innerHTML = `
    <h1>My Internet</h1><div class="sub">// ${esc(me.customer.customerNumber)} · ${esc(me.customer.phone||'')}</div>
    <div class="grid c4">
      <div class="card"><div class="k">Account</div><div class="v sm ${me.customer.status==='ACTIVE'?'ok':'warn'}">${esc(me.customer.status)}</div></div>
      <div class="card"><div class="k">Package</div><div class="v sm">${esc(sub?.packageName||'None')}</div></div>
      <div class="card"><div class="k">Speed</div><div class="v sm acc">${snap.downloadKbps?(snap.downloadKbps/1024).toFixed(1)+'M':'—'}</div></div>
      <div class="card"><div class="k">Expires</div><div class="v sm">${sub?.expiryTime?fmtDate(sub.expiryTime):'—'}</div></div>
    </div>
    ${fup?`<br/><div class="card"><div class="k">Data usage this period</div><div class="row" style="margin-top:8px"><div class="mono">${gb(fup.usedBytes)} / ${gb(fup.limitBytes)}</div><div class="spacer"></div>${pill(fup.state)}</div>
      <div style="height:8px;background:var(--bg);border-radius:5px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${Math.min(100,Number(fup.usedBytes)/Number(fup.limitBytes)*100).toFixed(0)}%;background:linear-gradient(90deg,var(--acc),var(--warn))"></div></div></div>`:''}
    <br/><div class="card"><div class="k">Quick actions</div><br><a href="/packages"><button class="ghost">BUY / RENEW A PACKAGE →</button></a></div>`;
};

// ---------- PACKAGES (customer buy) ----------
views.packages = async () => {
  if (!store.get('customer_token')) return location.href='/auth/login';
  const r = await api('/api/v1/packages'); let selected=null;
  $('#view').innerHTML = `<h1>Buy Internet</h1><div class="sub">// select a package · pay with M-Pesa</div>
    <div class="grid c4" id="pkgs"></div><br/>
    <div class="card" id="paycard" style="display:none"><div class="k">M-Pesa payment</div>
      <label class="f">Phone</label><input id="p-phone" placeholder="07… or 2547…" />
      <button class="wide" id="p-go">PAY NOW</button><p class="sub" id="p-status" style="margin-top:10px"></p></div>`;
  const grid=$('#pkgs');
  for (const p of r.data) { const el=document.createElement('div'); el.className='pkg';
    el.innerHTML=`<div class="name">${esc(p.name)}</div><div class="price">${fmtKes(p.priceMinor)}</div><div class="sub" style="margin:6px 0 0">${(p.durationSeconds/3600)}h · ${p.speed?(p.speed.downKbps/1024).toFixed(1)+'M↓':''} · ${p.maxDevices} dev</div>`;
    el.onclick=()=>{selected=p;document.querySelectorAll('.pkg').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');$('#paycard').style.display='block';}; grid.appendChild(el); }
  $('#p-go').onclick = async () => {
    if(!selected)return; $('#p-go').disabled=true; $('#p-status').textContent='Sending STK push…';
    try { const res=await api('/api/v1/payments/initiate',{method:'POST',body:JSON.stringify({packageId:selected.id,phone:$('#p-phone').value||undefined,idempotencyKey:crypto.randomUUID(),macAddress:'AA:BB:CC:00:00:'+Math.floor(Math.random()*255).toString(16).padStart(2,'0').toUpperCase()})});
      $('#p-status').textContent='STK sent — check your phone. Polling…'; const pid=res.paymentId;
      const poll=setInterval(async()=>{ const st=await api('/api/v1/payments/'+pid);
        if(st.payment.status==='SUCCESS'){clearInterval(poll);toast('Payment confirmed — you are online!');location.href='/dashboard';}
        if(['FAILED','CANCELLED','EXPIRED'].includes(st.payment.status)){clearInterval(poll);toast('Payment '+st.payment.status.toLowerCase(),true);$('#p-go').disabled=false;$('#p-status').textContent='Payment '+st.payment.status;}
      },3000);
    } catch(e){ toast(e.message,true); $('#p-go').disabled=false; } };
};

// ---------- GUEST ----------
views.guest = () => {
  $('#view').innerHTML = `<h1>Guest WiFi</h1><div class="sub">// buy instantly — no account</div>
    <div class="grid c2"><div class="card"><div class="k">Purchase</div>
      <label class="f">Company handle (optional)</label><input id="g-tenant" placeholder="acme-fibre" />
      <label class="f">Phone</label><input id="g-phone" placeholder="07…" />
      <div id="g-pkgs" class="grid c2" style="gap:8px;margin-top:8px"></div>
      <button class="wide" id="g-go" disabled>Select a package</button><p class="sub" id="g-status" style="margin-top:8px"></p></div>
    <div class="card"><div class="k">Check status by access code</div>
      <label class="f">Access code</label><input id="g-code" placeholder="GST-XXXXXXXX" /><button class="ghost" id="g-check">CHECK</button>
      <p class="sub" id="g-out" style="margin-top:10px"></p></div></div>`;
  let sel=null; const t=()=>$('#g-tenant').value.trim();
  const load=()=>fetch(API+'/api/v1/packages'+(t()?'?tenant='+encodeURIComponent(t()):'')).then(r=>r.json()).then(r=>{
    const g=$('#g-pkgs'); g.innerHTML=''; for(const p of r.data){ const el=document.createElement('div'); el.className='pkg';
      el.innerHTML=`<div class="name">${esc(p.name)}</div><div class="price">${fmtKes(p.priceMinor)}</div>`;
      el.onclick=()=>{sel=p;document.querySelectorAll('#g-pkgs .pkg').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');$('#g-go').disabled=false;$('#g-go').textContent='PAY '+fmtKes(p.priceMinor);}; g.appendChild(el);} });
  load(); $('#g-tenant').onchange=load;
  $('#g-go').onclick=async()=>{ $('#g-go').disabled=true; $('#g-status').textContent='Sending STK…';
    try{ const res=await api('/api/v1/guests/purchase',{method:'POST',body:JSON.stringify({phone:$('#g-phone').value,packageId:sel.id,tenant:t()||undefined,idempotencyKey:crypto.randomUUID(),macAddress:'02:00:'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0').match(/.{2}/g).join(':').toUpperCase()})});
      $('#g-status').textContent='STK sent. Access code: '+res.accessCode+' — polling…'; const code=res.accessCode;
      const poll=setInterval(async()=>{ const st=await api('/api/v1/guests/'+code);
        if(st.serviceStatus==='ONLINE'){clearInterval(poll);toast('You are online!');$('#g-out').innerHTML='STATUS: '+pill('ONLINE')+' '+esc(st.subscription.packageName);}
        if(['FAILED','CANCELLED','EXPIRED'].includes(st.lastPaymentStatus)){clearInterval(poll);toast('Payment '+st.lastPaymentStatus.toLowerCase(),true);$('#g-go').disabled=false;}
      },3000);
    }catch(e){toast(e.message,true);$('#g-go').disabled=false;} };
  $('#g-check').onclick=async()=>{ try{ const st=await api('/api/v1/guests/'+$('#g-code').value.trim());
    $('#g-out').innerHTML='STATUS: '+pill(st.serviceStatus)+(st.subscription?' · '+esc(st.subscription.packageName)+' · expires '+fmtWhen(st.subscription.expiryTime):''); }catch(e){toast(e.message,true);} };
};

// ---------- helper: paginated table fetch ----------
async function tget(path){ try { return await api(path); } catch { return null; } }
</script>
<script src="/portal-admin.js"></script>
<script src="/portal-owner.js"></script>
<script>
// ---------- ROUTER ----------
async function boot() {
  await loadMe();
  const path = location.pathname;
  renderChrome(path);
  if (path.startsWith('/auth')) return views.login();
  if (path === '/dashboard') return views.dashboard();
  if (path === '/packages') return views.packages();
  if (path === '/guest') return views.guest();
  if (path === '/admin') return views.admin();
  if (path === '/owner') return views.owner();
  if (path === '/guide') return views.guide();
  // landing
  if (store.get('customer_token')) return location.href='/dashboard';
  if (store.get('user_token')) return location.href = isOwner() ? '/owner' : '/admin';
  return views.login();
}
boot();
</script>
