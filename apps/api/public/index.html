<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXORA // ISP OS</title>
<style>
  :root {
    --bg: #06080d; --panel: #0b0f17; --panel2: #0e1420; --line: #1a2332;
    --txt: #d7e0ee; --dim: #6b7a90; --acc: #38e1c4; --warn: #f5c451; --crit: #f26d6d;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace; --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: var(--sans); font-size: 14px; min-height: 100vh; }
  a { color: var(--acc); text-decoration: none; }
  .mono { font-family: var(--mono); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 10; }
  header .brand { font-family: var(--mono); letter-spacing: 3px; font-size: 16px; color: var(--acc); }
  header .brand small { color: var(--dim); letter-spacing: 1px; }
  nav a { margin-left: 18px; font-family: var(--mono); font-size: 12px; color: var(--dim); text-transform: uppercase; }
  nav a.active, nav a:hover { color: var(--acc); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; letter-spacing: 1px; }
  .sub { color: var(--dim); font-size: 12px; font-family: var(--mono); margin-bottom: 24px; }
  .grid { display: grid; gap: 14px; }
  .grid.c4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .grid.c2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  .card .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-family: var(--mono); }
  .card .v { font-family: var(--mono); font-size: 22px; margin-top: 6px; }
  .card .v.ok { color: var(--acc); } .card .v.warn { color: var(--warn); } .card .v.crit { color: var(--crit); }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  th { text-align: left; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); color: var(--txt); }
  tr:hover td { background: var(--panel2); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; letter-spacing: 1px; }
  .pill.SUCCESS, .pill.ACTIVE, .pill.COMPLETED, .pill.ok { background: rgba(56,225,196,.12); color: var(--acc); border: 1px solid rgba(56,225,196,.4); }
  .pill.PENDING, .pill.PROCESSING, .pill.VERIFYING, .pill.STK { background: rgba(245,196,81,.1); color: var(--warn); border: 1px solid rgba(245,196,81,.4); }
  .pill.FAILED, .pill.PERMANENT_FAILURE, .pill.crit { background: rgba(242,109,109,.1); color: var(--crit); border: 1px solid rgba(242,109,109,.4); }
  .pill.RETRYING { background: rgba(56,225,196,.08); color: var(--dim); border: 1px solid var(--line); }
  input, button { font-family: var(--mono); font-size: 13px; }
  input { width: 100%; background: var(--bg); color: var(--txt); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; }
  input:focus { outline: none; border-color: var(--acc); }
  button { background: var(--acc); color: #04110d; border: none; border-radius: 4px; padding: 10px 16px; font-weight: 700; cursor: pointer; width: 100%; letter-spacing: 1px; }
  button:hover { filter: brightness(1.15); } button:disabled { opacity: .5; cursor: wait; }
  button.ghost { background: transparent; color: var(--acc); border: 1px solid var(--line); width: auto; padding: 4px 10px; font-size: 11px; }
  .pkg { cursor: pointer; border: 1px solid var(--line); border-radius: 6px; padding: 14px; background: var(--panel); }
  .pkg.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
  .pkg .name { font-family: var(--mono); font-size: 14px; color: var(--txt); }
  .pkg .price { font-family: var(--mono); font-size: 20px; color: var(--acc); margin-top: 4px; }
  .pkg .meta { color: var(--dim); font-size: 11px; font-family: var(--mono); margin-top: 6px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs button { width: auto; background: transparent; color: var(--dim); border: 1px solid var(--line); padding: 6px 14px; font-size: 11px; }
  .tabs button.active { color: var(--acc); border-color: var(--acc); }
  .c3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  select { background: var(--bg); color: var(--txt); border: 1px solid var(--line); border-radius: 4px; padding: 8px; font-family: var(--mono); margin-bottom: 12px; width: 100%; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--acc); color: var(--txt); padding: 12px 16px; border-radius: 6px; font-family: var(--mono); font-size: 12px; display: none; max-width: 380px; z-index: 99; }
  .err { border-color: var(--crit) !important; }
  .hide { display: none !important; }
  footer { text-align: center; color: var(--dim); font-family: var(--mono); font-size: 10px; padding: 40px 0; letter-spacing: 2px; }
</style>
</head>
<body>
<header>
  <div class="brand">NEXORA <small>// ISP OS</small></div>
  <nav id="nav">
    <a href="/dashboard" data-p="dashboard">Dashboard</a>
    <a href="/packages" data-p="packages">Packages</a>
    <a href="/guest" data-p="guest">Guest</a>
    <a href="/admin" data-p="admin">Admin</a>
  </nav>
</header>
<main id="view"><div class="card mono">LOADING…</div></main>
<div id="toast"></div>
<footer>NEXORA ISP OS // CONTROL PLANE // PHASE 1</footer>

<script>
const API = '';
const $ = (s) => document.querySelector(s);
const store = {
  get: (k) => JSON.parse(localStorage.getItem('nexora_' + k) || 'null'),
  set: (k, v) => localStorage.setItem('nexora_' + k, JSON.stringify(v)),
  del: (k) => localStorage.removeItem('nexora_' + k),
};
function toast(msg, isErr = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.borderColor = isErr ? 'var(--crit)' : 'var(--acc)';
  t.style.display = 'block';
  setTimeout(() => (t.style.display = 'none'), 5000);
}
async function api(path, opts = {}) {
  const token = store.get('user_token') || store.get('customer_token');
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(opts.headers || {}),
    },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.error?.message || body?.message || 'HTTP ' + res.status);
  return body;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function pill(v) { return '<span class="pill ' + esc(v) + '">' + esc(v) + '</span>'; }
function fmtKes(minor) { return 'KES ' + (Number(minor || 0) / 100).toFixed(2); }
function fmtWhen(iso) { return iso ? new Date(iso).toLocaleString() : '—'; }

// ---------- Views ----------
const views = {};

views.login = () => {
  const staff = !!store.get('user_token');
  $('#view').innerHTML = `
    <h1>${staff ? 'OPERATOR' : 'CUSTOMER'} ACCESS</h1>
    <div class="sub">// authenticate to the NEXORA control plane</div>
    <div class="grid c2">
      <div class="card">
        <div class="k">Operator / Staff Login</div><br>
        <input id="a-email" placeholder="admin@nexora.isp" />
        <input id="a-pass" type="password" placeholder="password" />
        <button id="a-go">AUTHENTICATE</button>
        <p class="sub" style="margin-top:10px">Requires a seeded admin account (see RAILWAY_SETUP.md).</p>
      </div>
      <div class="card">
        <div class="k">Customer Access</div><br>
        <input id="c-phone" placeholder="0712345678" />
        <input id="c-pass" type="password" placeholder="password (min 8 chars)" />
        <button id="c-login">SIGN IN</button>
        <button class="ghost" id="c-reg" style="width:100%;margin-top:8px">CREATE ACCOUNT</button>
      </div>
    </div>`;
  $('#a-go').onclick = async () => {
    try {
      const r = await api('/api/v1/auth/login', { method: 'POST', body: JSON.stringify({ email: $('#a-email').value, password: $('#a-pass').value }) });
      store.set('user_token', r.token); store.set('user', r.user); store.del('customer_token');
      location.href = '/admin';
    } catch (e) { toast(e.message, true); }
  };
  $('#c-login').onclick = async () => {
    try {
      const r = await api('/api/v1/customers/login', { method: 'POST', body: JSON.stringify({ phone: $('#c-phone').value, password: $('#c-pass').value }) });
      store.set('customer_token', r.token); store.del('user_token');
      location.href = '/dashboard';
    } catch (e) { toast(e.message, true); }
  };
  $('#c-reg').onclick = async () => {
    try {
      const r = await api('/api/v1/customers/register', { method: 'POST', body: JSON.stringify({ phone: $('#c-phone').value, password: $('#c-pass').value }) });
      store.set('customer_token', r.token); store.del('user_token');
      toast('Account created.');
      location.href = '/dashboard';
    } catch (e) { toast(e.message, true); }
  };
};

views.dashboard = async () => {
  if (!store.get('customer_token')) return views.login();
  let me;
  try { me = await api('/api/v1/customers/me'); } catch (e) { store.del('customer_token'); return views.login(); }
  const sub = me.subscription;
  const snap = sub?.policySnapshot || {};
  $('#view').innerHTML = `
    <h1>CUSTOMER DASHBOARD</h1>
    <div class="sub">// ${esc(me.customer.customerNumber)} · ${esc(me.customer.phone || '')}</div>
    <div class="grid c4">
      <div class="card"><div class="k">Account</div><div class="v ${me.customer.status === 'ACTIVE' ? 'ok' : 'warn'}">${esc(me.customer.status)}</div></div>
      <div class="card"><div class="k">Package</div><div class="v">${esc(sub?.package?.name || 'NONE')}</div></div>
      <div class="card"><div class="k">Speed</div><div class="v">${snap.downloadKbps ? snap.downloadKbps + 'k' : '—'}</div></div>
      <div class="card"><div class="k">Expires</div><div class="v">${sub?.expiryTime ? new Date(sub.expiryTime).toLocaleDateString() : '—'}</div></div>
    </div>
    <br/>
    <div class="card">
      <div class="k">Quick actions</div><br>
      <a href="/packages"><button class="ghost">BROWSE PACKAGES →</button></a>
    </div>`;
};

views.packages = async () => {
  if (!store.get('customer_token')) return views.login();
  const r = await api('/api/v1/packages');
  let selected = null;
  $('#view').innerHTML = `
    <h1>PACKAGES</h1>
    <div class="sub">// select a package and pay via M-Pesa STK push</div>
    <div class="grid c4" id="pkgs"></div>
    <br/>
    <div class="card" id="paycard" style="display:none">
      <div class="k">Payment</div><br>
      <input id="p-phone" placeholder="M-Pesa phone (07… or 2547…)" />
      <button id="p-go">PAY NOW</button>
      <p class="sub" id="p-status" style="margin-top:10px"></p>
    </div>`;
  const grid = $('#pkgs');
  for (const p of r.data) {
    const el = document.createElement('div');
    el.className = 'pkg';
    el.innerHTML = `<div class="name">${esc(p.name)}</div><div class="price">${fmtKes(p.priceMinor)}</div>
      <div class="meta">${p.durationSeconds / 3600}h · ${p.speed ? p.speed.downKbps + 'k↓' : ''}${p.maxDevices} dev</div>`;
    el.onclick = () => { selected = p; document.querySelectorAll('.pkg').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); $('#paycard').style.display = 'block'; };
    grid.appendChild(el);
  }
  $('#p-go').onclick = async () => {
    if (!selected) return;
    $('#p-go').disabled = true;
    $('#p-status').textContent = 'Initiating STK push…';
    try {
      const res = await api('/api/v1/payments/initiate', {
        method: 'POST',
        body: JSON.stringify({
          packageId: selected.id,
          phone: $('#p-phone').value || undefined,
          idempotencyKey: crypto.randomUUID(),
          macAddress: 'AA:BB:CC:00:00:' + Math.floor(Math.random() * 255).toString(16).padStart(2, '0').toUpperCase(),
        }),
      });
      $('#p-status').textContent = 'STK push sent — check your phone. Payment ' + res.status + '. Polling…';
      const pid = res.paymentId;
      const poll = setInterval(async () => {
        const st = await api('/api/v1/payments/' + pid);
        if (st.payment.status === 'SUCCESS') { clearInterval(poll); toast('Payment confirmed — provisioning.'); location.href = '/dashboard'; }
        if (st.payment.status === 'FAILED') { clearInterval(poll); toast('Payment failed: ' + (st.payment.failureReason || ''), true); $('#p-go').disabled = false; }
      }, 3000);
    } catch (e) { toast(e.message, true); $('#p-go').disabled = false; }
  };
};

views.guest = () => {
  $('#view').innerHTML = `
    <h1>GUEST ACCESS</h1>
    <div class="sub">// buy wifi instantly — no account needed (§36)</div>
    <div class="grid c2">
      <div class="card">
        <div class="k">Purchase</div><br>
        <input id="g-phone" placeholder="M-Pesa phone (07…)" />
        <div id="g-pkgs" class="grid c2" style="gap:8px"></div>
        <br><button id="g-go" disabled>Select a package</button>
        <p class="sub" id="g-status" style="margin-top:10px"></p>
      </div>
      <div class="card">
        <div class="k">Check status with access code</div><br>
        <input id="g-code" placeholder="GST-XXXXXXXX" />
        <button id="g-check">CHECK</button>
        <p class="sub" id="g-out" style="margin-top:10px"></p>
      </div>
    </div>`;
  let selected = null;
  fetch(API + '/api/v1/packages').then(r => r.json()).then(r => {
    const grid = $('#g-pkgs');
    for (const p of r.data) {
      const el = document.createElement('div');
      el.className = 'pkg';
      el.innerHTML = `<div class="name">${esc(p.name)}</div><div class="price">${fmtKes(p.priceMinor)}</div>`;
      el.onclick = () => { selected = p; document.querySelectorAll('.pkg').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); $('#g-go').disabled = false; $('#g-go').textContent = 'PAY ' + fmtKes(p.priceMinor); };
      grid.appendChild(el);
    }
  });
  $('#g-go').onclick = async () => {
    $('#g-go').disabled = true;
    $('#g-status').textContent = 'Sending STK push…';
    try {
      const res = await api('/api/v1/guests/purchase', { method: 'POST', body: JSON.stringify({
        phone: $('#g-phone').value, packageId: selected.id, idempotencyKey: crypto.randomUUID(),
        macAddress: '02:00:' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0').match(/.{2}/g).join(':').toUpperCase(),
      })});
      $('#g-status').textContent = 'STK sent. Access code: ' + res.accessCode + ' — polling…';
      const code = res.accessCode;
      const poll = setInterval(async () => {
        const st = await api('/api/v1/guests/' + code);
        if (st.serviceStatus === 'ONLINE') { clearInterval(poll); toast('Guest service ONLINE.'); $('#g-out').textContent = 'STATUS: ONLINE — ' + st.subscription.packageName; }
        if (st.lastPaymentStatus === 'FAILED') { clearInterval(poll); toast('Payment failed.', true); $('#g-go').disabled = false; }
      }, 3000);
    } catch (e) { toast(e.message, true); $('#g-go').disabled = false; }
  };
  $('#g-check').onclick = async () => {
    try {
      const st = await api('/api/v1/guests/' + $('#g-code').value.trim());
      $('#g-out').innerHTML = `STATUS: <span class="pill ${st.serviceStatus === 'ONLINE' ? 'SUCCESS' : 'PENDING'}">${st.serviceStatus}</span>` +
        (st.subscription ? ` · ${esc(st.subscription.packageName)} · expires ${st.subscription.expiryTime ? new Date(st.subscription.expiryTime).toLocaleString() : '—'}` : '');
    } catch (e) { toast(e.message, true); }
  };
};

views.admin = async (tab) => {
  if (!store.get('user_token')) { toast('Operator login required', true); return views.login(); }
  tab = tab || (views.admin._tab || 'overview');
  views.admin._tab = tab;
  const tabs = ['overview', 'customers', 'packages', 'users', 'ops', 'triggers'];
  $('#view').innerHTML = `
    <h1>ADMIN COMMAND CENTER</h1>
    <div class="sub">// business state · desired state · actual state · audit</div>
    <div class="tabs" id="adm-tabs">${tabs.map(t => `<button class="${t === tab ? 'active' : ''}" data-tab="${t}">${t.toUpperCase()}</button>`).join('')}</div>
    <div id="adm-body"><div class="card mono">LOADING…</div></div>`;
  document.querySelectorAll('#adm-tabs button').forEach(b => b.onclick = () => views.admin(b.dataset.tab));
  const body = $('#adm-body');

  if (tab === 'overview') {
    const [sum, pays, ops] = await Promise.all([
      api('/api/v1/admin/summary').catch(() => null),
      api('/api/v1/admin/payments?limit=12').catch(() => null),
      api('/api/v1/admin/network-operations?limit=12').catch(() => null),
    ]);
    const s = sum?.summary || {};
    body.innerHTML = `
    <div class="grid c4">
      <div class="card"><div class="k">Customers</div><div class="v">${s.customers ?? '—'}</div></div>
      <div class="card"><div class="k">Active subs</div><div class="v ok">${s.activeSubscriptions ?? '—'}</div></div>
      <div class="card"><div class="k">Revenue</div><div class="v">${s.revenueMinor != null ? fmtKes(s.revenueMinor) : '—'}</div></div>
      <div class="card"><div class="k">Net ops queued / failed</div><div class="v ${s.failedNetworkOperations ? 'crit' : 'ok'}">${s.queuedNetworkOperations ?? 0} / ${s.failedNetworkOperations ?? 0}</div></div>
    </div>
    <br/>
    <div class="grid c2">
      <div class="card"><div class="k">Recent payments</div><br>
        <table><tr><th>Status</th><th>Amount</th><th>Package</th><th>Receipt</th><th>When</th></tr>
        ${(pays?.data || []).map(p => `<tr><td>${pill(p.status)}</td><td>${fmtKes(p.amountMinor)}</td><td>${esc(p.package?.name || '—')}</td><td class="mono">${esc(p.receipt || '—')}</td><td>${fmtWhen(p.createdAt)}</td></tr>`).join('') || '<tr><td colspan="5" class="sub">no payments yet</td></tr>'}
        </table></div>
      <div class="card"><div class="k">Network operations</div><br>
        <table><tr><th>Type</th><th>Status</th><th>Attempts</th><th>Router</th><th>Action</th></tr>
        ${(ops?.data || []).map(o => `<tr><td>${esc(o.type)}</td><td>${pill(o.status)}</td><td>${esc(o.attempts)}</td><td>${esc(o.router)}</td><td>${o.status === 'PERMANENT_FAILURE' ? '<button class="ghost" data-retry="' + o.id + '">RETRY</button>' : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="sub">queue empty</td></tr>'}
        </table></div>
    </div>`;
    body.querySelectorAll('[data-retry]').forEach(b => {
      b.onclick = async () => {
        try { await api('/api/v1/admin/network-operations/' + b.dataset.retry + '/retry', { method: 'POST' }); toast('Re-queued.'); views.admin(); } catch (e) { toast(e.message, true); }
      };
    });
  }

  if (tab === 'customers') {
    const cs = await api('/api/v1/admin/customers?limit=50');
    body.innerHTML = `<div class="card"><div class="k">Customers — click for 3-pane detail (Business / Desired / Actual)</div><br>
      <table><tr><th>Number</th><th>Type</th><th>Status</th><th>Phone</th><th>Package</th><th>Expiry</th><th></th></tr>
      ${cs.data.map(c => `<tr><td class="mono">${esc(c.customerNumber)}</td><td>${esc(c.accountType)}</td><td>${pill(c.status)}</td><td>${esc(c.phone || '—')}</td><td>${esc(c.activeSubscription?.packageName || '—')}</td><td>${c.activeSubscription?.expiryTime ? new Date(c.activeSubscription.expiryTime).toLocaleString() : '—'}</td><td><button class="ghost" data-cust="${c.id}">INSPECT</button></td></tr>`).join('') || '<tr><td colspan="7" class="sub">none</td></tr>'}
      </table></div><div id="cust-detail"></div>`;
    body.querySelectorAll('[data-cust]').forEach(b => b.onclick = async () => {
      const d = await api('/api/v1/admin/customers/' + b.dataset.cust);
      const dv = d.desiredNetworkState, ac = d.actualNetworkState;
      $('#cust-detail').innerHTML = `<br><div class="grid c3">
        <div class="card"><div class="k">BUSINESS STATE</div><br>
          <table>
            <tr><td>Sub</td><td>${pill(d.business.subscription?.status || 'NONE')}</td></tr>
            <tr><td>Package</td><td>${esc(d.business.subscription?.packageName || '—')}</td></tr>
            <tr><td>FUP</td><td>${d.business.subscription?.fup ? pill(d.business.subscription.fup.state) + ' ' + (Number(d.business.subscription.fup.usedBytes)/1e9).toFixed(1) + '/' + (Number(d.business.subscription.fup.limitBytes)/1e9).toFixed(1) + 'GB' : '—'}</td></tr>
            <tr><td>Payments</td><td>${d.business.payments.length}</td></tr>
          </table></div>
        <div class="card"><div class="k">DESIRED NETWORK STATE</div><br>
          <table>
            <tr><td>Version</td><td>v${dv?.version ?? '—'}</td></tr>
            <tr><td>Authorized</td><td>${dv?.state?.authorized ?? '—'}</td></tr>
            <tr><td>Rate</td><td>${dv?.state?.rateLimit ? dv.state.rateLimit.downloadKbps + 'k/' + dv.state.rateLimit.uploadKbps + 'k' : '—'}</td></tr>
            <tr><td>Synced</td><td>${dv?.synchronizedAt ? new Date(dv.synchronizedAt).toLocaleString() : 'never'}</td></tr>
          </table></div>
        <div class="card"><div class="k">ACTUAL NETWORK STATE</div><br>
          <table>
            <tr><td>Last op</td><td>${ac ? esc(ac.lastOperation.type) + ' ' + pill(ac.lastOperation.status) : '—'}</td></tr>
            <tr><td>Verified</td><td>${ac?.lastOperation?.verifiedAt ? new Date(ac.lastOperation.verifiedAt).toLocaleString() : '—'}</td></tr>
            <tr><td>Drift</td><td>${pill(d.driftVerdict === 'SYNCHRONIZED' ? 'SUCCESS' : d.driftVerdict === 'DRIFTED' ? 'FAILED' : 'PENDING')}</td></tr>
            <tr><td>Devices</td><td>${d.devices.length}</td></tr>
          </table></div>
      </div>`;
    });
  }

  if (tab === 'packages') {
    const pkgs = await api('/api/v1/admin/packages');
    body.innerHTML = `<div class="grid c2">
      <div class="card"><div class="k">Packages</div><br>
        <table><tr><th>Name</th><th>v</th><th>Status</th><th>Price</th><th>Speed</th><th></th></tr>
        ${pkgs.data.map(p => `<tr><td>${esc(p.name)}</td><td>v${p.version}</td><td>${pill(p.status)}</td><td>${fmtKes(p.priceMinor)}</td><td>${p.policy ? p.policy.downloadKbps + '/' + p.policy.uploadKbps + 'k' : '—'}</td><td>${p.status === 'ACTIVE' ? '<button class="ghost" data-retire="' + p.id + '">RETIRE</button>' : ''}</td></tr>`).join('')}
        </table></div>
      <div class="card"><div class="k">Create package (edits create new versions — history immutable)</div><br>
        <input id="np-name" placeholder="name (e.g. Month Pass)" />
        <input id="np-price" placeholder="price KES (minor units, e.g. 50000)" />
        <input id="np-duration" placeholder="duration seconds (e.g. 2592000)" />
        <input id="np-down" placeholder="download kbps (e.g. 10240)" />
        <input id="np-up" placeholder="upload kbps (e.g. 5120)" />
        <input id="np-fup" placeholder="FUP limit bytes (optional, e.g. 53687091200)" />
        <button id="np-go">CREATE</button></div></div>`;
    body.querySelector('#np-go').onclick = async () => {
      try {
        await api('/api/v1/admin/packages', { method: 'POST', body: JSON.stringify({
          name: $('#np-name').value, priceMinor: Number($('#np-price').value), durationSeconds: Number($('#np-duration').value),
          policy: { downloadKbps: Number($('#np-down').value), uploadKbps: Number($('#np-up').value), ...( $('#np-fup').value ? { fupLimitBytes: $('#np-fup').value } : {}) },
        })});
        toast('Package created.'); views.admin('packages');
      } catch (e) { toast(e.message, true); }
    };
    body.querySelectorAll('[data-retire]').forEach(b => b.onclick = async () => {
      try { await api('/api/v1/admin/packages/' + b.dataset.retire, { method: 'DELETE' }); toast('Retired.'); views.admin('packages'); } catch (e) { toast(e.message, true); }
    });
  }

  if (tab === 'users') {
    const [users, roles] = await Promise.all([api('/api/v1/admin/users'), api('/api/v1/admin/roles')]);
    const roleNames = roles.data.map(r => r.name);
    body.innerHTML = `<div class="grid c2">
      <div class="card"><div class="k">Staff users</div><br>
        <table><tr><th>Email</th><th>Role</th><th>Status</th><th>Last login</th></tr>
        ${users.data.map(u => `<tr><td>${esc(u.email)}</td><td><select data-user="${u.id}">${roleNames.map(r => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}</select></td><td>${pill(u.status)}</td><td>${u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleString() : '—'}</td></tr>`).join('')}
        </table></div>
      <div class="card"><div class="k">Create staff user</div><br>
        <input id="nu-email" placeholder="email" />
        <input id="nu-pass" type="password" placeholder="password (min 10 chars)" />
        <input id="nu-name" placeholder="display name" />
        <select id="nu-role">${roleNames.map(r => `<option>${r}</option>`).join('')}</select>
        <button id="nu-go">CREATE</button>
        <p class="sub" style="margin-top:8px">Role changes revoke live sessions — new permissions apply at next login. All audited.</p></div></div>`;
    body.querySelectorAll('select[data-user]').forEach(sel => sel.onchange = async () => {
      try { await api('/api/v1/admin/users/' + sel.dataset.user, { method: 'PATCH', body: JSON.stringify({ role: sel.value }) }); toast('Role assigned + sessions revoked.'); } catch (e) { toast(e.message, true); }
    });
    body.querySelector('#nu-go').onclick = async () => {
      try { await api('/api/v1/admin/users', { method: 'POST', body: JSON.stringify({ email: $('#nu-email').value, password: $('#nu-pass').value, displayName: $('#nu-name').value, role: $('#nu-role').value }) }); toast('User created.'); views.admin('users'); } catch (e) { toast(e.message, true); }
    };
  }

  if (tab === 'ops') {
    const [sessions, ops] = await Promise.all([
      api('/api/v1/admin/sessions').catch(() => null),
      api('/api/v1/admin/network-operations?limit=25').catch(() => null),
    ]);
    body.innerHTML = `<div class="grid c2">
      <div class="card"><div class="k">Live sessions</div><br>
        <table><tr><th>Customer</th><th>MAC</th><th>Status</th><th>↓/↑</th><th></th></tr>
        ${(sessions?.data || []).map(s => `<tr><td>${esc(s.customer)}</td><td class="mono">${esc(s.macAddress)}</td><td>${pill(s.status)}</td><td>${s.downloadBytes}/${s.uploadBytes}</td><td><button class="ghost" data-disc="${s.id}">DISCONNECT</button></td></tr>`).join('') || '<tr><td colspan="5" class="sub">no active sessions</td></tr>'}
        </table></div>
      <div class="card"><div class="k">Network operations</div><br>
        <table><tr><th>Type</th><th>Status</th><th>Att.</th><th>Router</th><th></th></tr>
        ${(ops?.data || []).map(o => `<tr><td>${esc(o.type)}</td><td>${pill(o.status)}</td><td>${esc(o.attempts)}</td><td>${esc(o.router)}</td><td>${o.status === 'PERMANENT_FAILURE' ? '<button class="ghost" data-retry="' + o.id + '">RETRY</button>' : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="sub">queue empty</td></tr>'}
        </table></div></div>`;
    body.querySelectorAll('[data-disc]').forEach(b => b.onclick = async () => {
      try { await api('/api/v1/admin/sessions/' + b.dataset.disc + '/disconnect', { method: 'POST' }); toast('Disconnect queued.'); views.admin('ops'); } catch (e) { toast(e.message, true); }
    });
    body.querySelectorAll('[data-retry]').forEach(b => b.onclick = async () => {
      try { await api('/api/v1/admin/network-operations/' + b.dataset.retry + '/retry', { method: 'POST' }); toast('Re-queued.'); views.admin('ops'); } catch (e) { toast(e.message, true); }
    });
  }

  if (tab === 'triggers') {
    const pc = await api('/api/v1/admin/payment-config').catch(() => null);
    body.innerHTML = `<div class="grid c2">
      <div class="card"><div class="k">Payment configuration (§4.1)</div><br>
        <table>
          <tr><td>Provider</td><td class="mono">${esc(pc?.provider || '—')}</td></tr>
          <tr><td>Daraja configured</td><td>${pc?.daraja?.configured ? pill('SUCCESS') : pill('PENDING')} ${pc?.daraba?.configured ? '' : '(mock mode until MPESA_* secrets are set)'}</td></tr>
          <tr><td>Daraja env</td><td>${esc(pc?.daraja?.environment || '—')}</td></tr>
          <tr><td>Callback URL</td><td class="mono">${esc(pc?.daraja?.callbackUrl || 'not set')}</td></tr>
        </table>
        <p class="sub" style="margin-top:8px">${esc(pc?.note || '')}</p>
        <button class="ghost" id="trig-pay">RUN PAYMENT RECONCILIATION</button></div>
      <div class="card"><div class="k">Network reconciliation (§4.4)</div><br>
        <p class="sub">Detects desired-vs-actual drift across subscribers and queues repair operations with read-back verification.</p>
        <button class="ghost" id="trig-net">RUN NETWORK RECONCILIATION</button>
        <br><br><div class="k">Router health</div>
        <p class="sub">Health polling runs on the scheduler (every minute).</p></div></div>`;
    body.querySelector('#trig-pay').onclick = async () => {
      try { await api('/api/v1/admin/payment-config/reconcile', { method: 'POST' }); toast('Payment reconciliation queued.'); } catch (e) { toast(e.message, true); }
    };
    body.querySelector('#trig-net').onclick = async () => {
      try { await api('/api/v1/admin/network/reconcile', { method: 'POST' }); toast('Network reconciliation queued.'); } catch (e) { toast(e.message, true); }
    };
  }
};

// ---------- Router ----------
const path = location.pathname;
if (path.startsWith('/auth')) views.login();
else if (path === '/dashboard') views.dashboard();
else if (path === '/packages') views.packages();
else if (path === '/guest') views.guest();
else if (path === '/admin') views.admin();
else {
  // Landing: route by session
  if (store.get('customer_token')) location.href = '/dashboard';
  else if (store.get('user_token')) location.href = '/admin';
  else views.login();
}
document.querySelectorAll('#nav a').forEach(a => {
  if (a.dataset.p === path.split('/')[1]) a.classList.add('active');
});
</script>
</body>
</html>
